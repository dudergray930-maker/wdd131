<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Character card for Snortleblat, the Swamp Beast Diplomat.">

  <meta property="og:title" content="Snortleblat Character Card">
  <meta property="og:description" content="Meet Snortleblat, the Swamp Beast Diplomat.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">
  <meta property="og:image:alt" content="Snortleblat, the Swamp Beast Diplomat">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Snortleblat Character Card">
  <meta name="twitter:description" content="Meet Snortleblat, the Swamp Beast Diplomat.">
  <meta name="twitter:image" content="https://andejuli.github.io/wdd131/character_card/snortleblat.webp">

  <title>Snortleblat Character Card</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <article class="character-card">
      <img
        class="character-image"
        id="character-image"
        src="https://andejuli.github.io/wdd131/character_card/snortleblat.webp"
        alt="Snortleblat, a swamp beast diplomat"
        width="420"
        height="420"
      >

      <h1 id="character-name">Snortleblat</h1>

      <div class="character-info">
        <p>Class: <span id="character-class">Swamp Beast Diplomat</span></p>
        <p>Level: <span id="character-level">5</span></p>
        <p>Health: <span id="character-health">100</span></p>

        <div class="buttons">
          <button id="attacked-button" type="button">Attacked</button>
          <button id="level-up-button" type="button">Level Up</button>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
