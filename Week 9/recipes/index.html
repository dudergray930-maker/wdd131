<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple recipe book featuring an easy, delicious apple crisp recipe.">

  <title>Recipe Book | Apple Crisp</title>

  <!-- Open Graph (Facebook, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Recipe Book | Apple Crisp">
  <meta property="og:description" content="A simple, delicious apple crisp recipe served warm with vanilla ice cream.">
  <meta property="og:url" content="https://your-domain.example/recipes/">
  <meta property="og:image" content="https://your-domain.example/recipes/images/social-preview-image.png">

  <!-- X Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Recipe Book | Apple Crisp">
  <meta name="twitter:description" content="A simple, delicious apple crisp recipe served warm with vanilla ice cream.">
  <meta name="twitter:image" content="https://your-domain.example/recipes/images/social-preview-image.png">

  <!-- One favicon (ICO works everywhere) -->
  <link rel="icon" href="../favicon.ico">

  <!-- One Apple Touch Icon (iOS home screen) -->
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="page">
    <header class="site-header">
      <img class="logo" src="images/recipe-book.png" alt="">
      <h1>RecipeBook</h1>
    </header>

    <main>
      <form class="search" role="search">
        <label class="visually-hidden" for="recipe-search">Find a recipe</label>
        <input id="recipe-search" type="search" placeholder="Find a recipe">
        <button type="submit" aria-label="Search recipes">
          <img src="images/search.svg" alt="">
        </button>
      </form>

      <article class="recipe">
        <img class="recipe-image" src="images/apple-crisp.jpg" alt="Warm apple crisp topped with vanilla ice cream">

        <div class="recipe-details">
          <span class="tag">dessert</span>
          <h2>Apple Crisp</h2>

          <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star">⭐</span>
            <span aria-hidden="true" class="icon-star-empty">☆</span>
          </span>

          <p class="description">
            This apple crisp recipe is a simple yet delicious fall dessert
            that's great served warm with vanilla ice cream.
          </p>
        </div>
      </article>
    </main>

    <footer class="site-footer">
      <a class="flaticon-credit"
         href="https://www.flaticon.com/free-icons/recipe"
         title="recipe icons">
        Recipe icons created by Freepik - Flaticon
      </a>

      <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates -->
        <a href="#" aria-label="Instagram">
          <img src="images/instagram_icon.svg" alt="instagram icon">
        </a>
        <a href="#" aria-label="YouTube">
          <img src="images/youtube_icon.svg" alt="youtube icon">
        </a>
        <a href="#" aria-label="Pinterest">
          <img src="images/pinterest_icon.svg" alt="pinterest icon">
        </a>
      </div>
    </footer>
  </div>
</body>
</html>
